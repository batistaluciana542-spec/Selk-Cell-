<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selk Cell | Loja</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f0ff;
  color:#24113d;
}

header{
  background:linear-gradient(135deg,#6d28d9,#9333ea);
  color:white;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 4px 15px #0002;
}

header h1{
  margin:0;
  font-size:24px;
}

.menu{
  font-size:28px;
  cursor:pointer;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

.hero{
  text-align:center;
  padding:25px 10px;
}

.hero h2{
  margin:0 0 8px;
  font-size:30px;
}

.hero p{
  margin:0;
  color:#6b5a7d;
}

#status{
  text-align:center;
  padding:15px;
  color:#6d28d9;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:15px;
  box-shadow:0 5px 20px #4c1d9515;
  border:1px solid #eadcff;
}

.product-image{
  width:100%;
  height:170px;
  border-radius:14px;
  background:#f1e9ff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:65px;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card h3{
  margin:14px 0 7px;
}

.description{
  color:#766783;
  font-size:14px;
  min-height:35px;
}

.price{
  color:#6d28d9;
  font-size:22px;
  font-weight:bold;
  margin:12px 0;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 16px;
  background:#7c3aed;
  color:white;
  font-weight:bold;
  cursor:pointer;
  width:100%;
}

button:hover{
  background:#6d28d9;
}

#menuPanel{
  display:none;
  position:fixed;
  top:65px;
  right:15px;
  background:white;
  padding:15px;
  border-radius:15px;
  box-shadow:0 8px 30px #0003;
  z-index:20;
}

#menuPanel button{
  width:auto;
  margin-top:5px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:center;
  justify-content:center;
  z-index:50;
}

.modal-box{
  background:white;
  width:min(450px,90%);
  padding:25px;
  border-radius:20px;
}

.modal-box h2{
  margin-top:0;
}

input{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
}

.close{
  background:#ddd;
  color:#222;
  margin-top:8px;
}

footer{
  text-align:center;
  padding:30px;
  color:#766783;
}
</style>
</head>

<body>

<header>
  <h1>Selk Cell</h1>
  <div class="menu" onclick="toggleMenu()">⋮</div>
</header>

<div id="menuPanel">
  <button onclick="developer()">Desenvolvedor</button>
</div>

<div class="container">

  <section class="hero">
    <h2>Produtos</h2>
    <p>Confira nossos produtos disponíveis</p>
  </section>

  <div id="status">Carregando produtos...</div>

  <section id="products" class="products"></section>

</div>

<footer>
  Selk Cell © 2026
</footer>

<div id="buyModal" class="modal">
  <div class="modal-box">
    <h2 id="buyTitle">Comprar</h2>
    <p>Entre em contato para finalizar seu pedido.</p>

    <input id="customerName" placeholder="Seu nome">

    <button onclick="sendWhatsApp()">Enviar pedido pelo WhatsApp</button>

    <button class="close" onclick="closeModal()">Fechar</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://sbrfgdkvpgvlufqkmxxz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8HjFeiILlQpA3QAYaSZD1w_xySKAMrv";

let selectedProduct = null;

async function loadProducts(){

  const status = document.getElementById("status");
  const container = document.getElementById("products");

  try{

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/products?select=*",
      {
        headers:{
          "apikey":SUPABASE_ANON_KEY,
          "headers:{
  headers:{
  const response = await fetch(
  SUPABASE_URL + "/rest/v1/products?select=*",
  {
    headers:{
      "apikey":SUPABASE_ANON_KEY
    }
  }
);
    );

    if(!response.ok){
      throw new Error("Erro " + response.status);
    }

    const products = await response.json();

    container.innerHTML = "";

    if(!products.length){
      status.textContent = "Nenhum produto cadastrado.";
      return;
    }

    status.textContent = "";

    products.forEach(product => {

      const card = document.createElement("div");
      card.className = "card";

      const image =
        product.image && product.image.trim() !== ""
        ? `<img src="${product.image}" alt="${product.name}">`
        : `<span>${product.emoji || "📱"}</span>`;

      card.innerHTML = `
        <div class="product-image">
          ${image}
        </div>

        <h3>${product.name || "Produto"}</h3>

        <div class="description">
          ${product.description || ""}
        </div>

        <div class="price">
          R$ ${Number(product.price || 0).toFixed(2).replace(".",",")}
        </div>

        <button onclick='openBuy(${JSON.stringify(product)})'>
          Comprar
        </button>
      `;

      container.appendChild(card);
    });

  }catch(error){

  console.error(error);

  status.textContent =
    "ERRO: " + error.message;

    }
}

function toggleMenu(){

  const menu = document.getElementById("menuPanel");

  menu.style.display =
    menu.style.display === "block"
    ? "none"
    : "block";
}

function developer(){

  const pin = prompt("Digite o PIN do desenvolvedor:");

  if(pin === null) return;

  alert(
    "Área de desenvolvedor será adicionada na próxima etapa."
  );
}

function openBuy(product){

  selectedProduct = product;

  document.getElementById("buyTitle").textContent =
    "Comprar: " + product.name;

  document.getElementById("buyModal").style.display =
    "flex";
}

function closeModal(){

  document.getElementById("buyModal").style.display =
    "none";
}

function sendWhatsApp(){

  if(!selectedProduct) return;

  const name =
    document.getElementById("customerName").value ||
    "Cliente";

  const message =
    `Olá! Meu nome é ${name}. Quero comprar ${selectedProduct.name} por R$ ${Number(selectedProduct.price).toFixed(2).replace(".",",")}.`;

  const phone = "5500000000000";

  window.open(
    "https://wa.me/" + phone +
    "?text=" + encodeURIComponent(message),
    "_blank"
  );
}

loadProducts();
</script>

</body>
</html>
