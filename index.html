<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Padaria Artesanal - Pedidos Online</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #7c3aed;
      --primary-dark: #6d28d9;
      --secondary: #f43f5e;
      --bg: #0f172a;
      --surface: rgba(30, 41, 59, 0.7);
      --surface-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.25) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.2) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--surface-border);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
    }

    .logo i {
      color: var(--primary);
      font-size: 1.4rem;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--secondary);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Categorias */
    .categories {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.9rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      font-weight: 600;
    }

    /* Grid de Produtos */
    .container {
      padding: 0 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      margin-top: 10px;
    }

    @media (min-width: 600px) {
      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      backdrop-filter: blur(8px);
    }

    .product-img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      background: rgba(255,255,255,0.05);
    }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .product-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-bottom {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price {
      font-size: 1.05rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .add-btn {
      background: var(--primary);
      color: white;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .dev-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
    }

    .dev-btn {
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Floating Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      max-width: 500px;
      margin: 0 auto;
      background: var(--primary);
      color: white;
      padding: 14px 20px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.4);
      cursor: pointer;
      z-index: 90;
      font-weight: 600;
    }

    /* Modais / Drawers */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #1e293b;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
      overflow-y: auto;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Formulários e Inputs */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--surface-border);
      padding: 12px;
      border-radius: 10px;
      color: white;
      font-size: 0.95rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Lista do Carrinho */
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--surface-border);
    }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty-btn {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 8px;
    }
    .status-online { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .status-offline { background: rgba(239, 68, 68, 0.2); color: #f87171; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-bread-slice"></i>
      <span>Padaria <span id="sync-status" class="status-badge status-offline">Conectando...</span></span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="window.promptDevMode()" title="Modo Desenvolvedor">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </button>
      <button class="icon-btn" onclick="window.openCart()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="badge" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <!-- Categorias -->
  <div class="categories">
    <button class="cat-btn active" onclick="window.filterCategory('todos', this)">Todos</button>
    <button class="cat-btn" onclick="window.filterCategory('Paes', this)">Pães</button>
    <button class="cat-btn" onclick="window.filterCategory('Doces', this)">Doces & Bolos</button>
    <button class="cat-btn" onclick="window.filterCategory('Salgados', this)">Salgados</button>
    <button class="cat-btn" onclick="window.filterCategory('Bebidas', this)">Bebidas</button>
  </div>

  <!-- Botão Adicionar Produto (Visível apenas em Modo Dev) -->
  <div class="container" id="dev-panel" style="display: none; margin-bottom: 15px;">
    <button class="btn-submit" onclick="window.openProductModal()" style="background: #10b981;">
      <i class="fa-solid fa-plus"></i> Adicionar Novo Produto
    </button>
  </div>

  <!-- Grid de Produtos -->
  <div class="container">
    <div class="products-grid" id="products-container">
      <!-- Produtos inseridos via JS -->
    </div>
  </div>

  <!-- Barra Flutuante do Carrinho -->
  <div class="cart-bar" id="cart-bar" onclick="window.openCart()" style="display: none;">
    <div>
      <span id="cart-bar-count">0</span> itens no carrinho
    </div>
    <div>
      Ver Pedido: <span id="cart-bar-total">R$ 0,00</span>
    </div>
  </div>

  <!-- Modal do Carrinho -->
  <div class="modal" id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Seu Pedido</h3>
        <button class="close-btn" onclick="window.closeCart()">&times;</button>
      </div>
      <div id="cart-items-list">
        <!-- Itens do carrinho -->
      </div>
      <div style="margin-top: 20px;">
        <div class="form-group">
          <label>Endereço de Entrega / Retirada</label>
          <input type="text" id="cust-address" class="form-control" placeholder="Rua, Número, Bairro">
        </div>
        <div class="form-group">
          <label>Forma de Pagamento</label>
          <select id="cust-payment" class="form-control">
            <option value="Pix">Pix</option>
            <option value="Cartão na Entrega">Cartão na Entrega</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>
        </div>
        <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; margin: 15px 0;">
          <span>Total:</span>
          <span id="cart-total-modal">R$ 0,00</span>
        </div>
        <button class="btn-submit" onclick="window.checkoutWhatsApp()">
          <i class="fa-brands fa-whatsapp"></i> Enviar Pedido pelo WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Cadastro/Edição de Produto -->
  <div class="modal" id="product-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Novo Produto</h3>
        <button class="close-btn" onclick="window.closeProductModal()">&times;</button>
      </div>
      <form onsubmit="window.saveProduct(event)">
        <input type="hidden" id="prod-id">
        <div class="form-group">
          <label>Nome do Produto</label>
          <input type="text" id="prod-name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Preço (R$)</label>
          <input type="number" step="0.01" id="prod-price" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Categoria</label>
          <select id="prod-category" class="form-control">
            <option value="Paes">Pães</option>
            <option value="Doces">Doces & Bolos</option>
            <option value="Salgados">Salgados</option>
            <option value="Bebidas">Bebidas</option>
          </select>
        </div>
        <div class="form-group">
          <label>URL da Imagem (Link)</label>
          <input type="url" id="prod-image" class="form-control" placeholder="https://exemplo.com/imagem.jpg">
        </div>
        <div class="form-group">
          <label>Descrição</label>
          <textarea id="prod-desc" class="form-control" rows="2"></textarea>
        </div>
        <button type="submit" class="btn-submit">Salvar no Supabase</button>
      </form>
    </div>
  </div>

  <script>
    // Configurações do Supabase
    const SUPABASE_URL = 'https://sbrfgdkvpgvlufqkmxxz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8HjFeiILlQpA3QAYaSZD1w_xySKAMrv';
    const WHATSAPP_NUMBER = '64996609321';

    let db = null;
    let products = [];
    let cart = [];
    let isDevMode = false;
    let currentCategory = 'todos';

    // Produtos Iniciais Padrão (se o banco estiver vazio)
    const initialProducts = [
      { id: '1', nome: 'Pão Francês (kg)', preco: 14.90, categoria: 'Paes', imagem: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400', descricao: 'Pão quentinho e crocante.' },
      { id: '2', nome: 'Bolo de Cenoura', preco: 22.00, categoria: 'Doces', imagem: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400', descricao: 'Com cobertura de chocolate.' },
      { id: '3', nome: 'Coxinha de Frango', preco: 7.50, categoria: 'Salgados', imagem: 'https://images.unsplash.com/photo-1562967914-608f82629710?w=400', descricao: 'Recheio cremoso e crocante.' },
      { id: '4', nome: 'Café com Leite', preco: 5.00, categoria: 'Bebidas', imagem: 'https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=400', descricao: 'Café expresso com leite vaporizado.' }
    ];

    // Inicialização
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        if (window.supabase) {
          db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          updateStatus(true);
          await loadProducts();
          subscribeRealtime();
        } else {
          updateStatus(false);
          products = initialProducts;
          renderProducts();
        }
      } catch (e) {
        console.error("Erro na inicialização:", e);
        updateStatus(false);
        products = initialProducts;
        renderProducts();
      }
    });

    function updateStatus(online) {
      const el = document.getElementById('sync-status');
      if (online) {
        el.className = 'status-badge status-online';
        el.innerText = 'Online';
      } else {
        el.className = 'status-badge status-offline';
        el.innerText = 'Offline';
      }
    }

    // Carregar Produtos do Supabase
    async function loadProducts() {
      if (!db) return;
      try {
        const { data, error } = await db.from('produtos').select('*');
        if (error) throw error;

        if (data && data.length > 0) {
          products = data;
        } else {
          // Se o banco estiver vazio, semeia os produtos iniciais
          for (let item of initialProducts) {
            await db.from('produtos').insert([item]);
          }
          products = initialProducts;
        }
        renderProducts();
      } catch (err) {
        console.warn("Falha ao carregar do Supabase. Usando produtos padrão:", err.message);
        products = initialProducts;
        renderProducts();
      }
    }

    // Sincronização em Tempo Real
    function subscribeRealtime() {
      if (!db) return;
      db.channel('produtos_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'produtos' }, () => {
          loadProducts();
        })
        .subscribe();
    }

    // Renderizar Produtos na Tela
    function renderProducts() {
      const container = document.getElementById('products-container');
      container.innerHTML = '';

      const filtered = currentCategory === 'todos' 
        ? products 
        : products.filter(p => p.categoria === currentCategory);

      if (filtered.length === 0) {
        container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">Nenhum produto nesta categoria.</p>`;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          ${isDevMode ? `
            <div class="dev-actions">
              <button class="dev-btn" onclick="window.editProduct('${p.id}')"><i class="fa-solid fa-pen"></i></button>
              <button class="dev-btn" style="background:#ef4444;" onclick="window.deleteProduct('${p.id}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          ` : ''}
          <img src="${p.imagem || 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400'}" class="product-img" alt="${p.nome}">
          <div class="product-info">
            <div class="product-title">${p.nome}</div>
            <div class="product-desc">${p.descricao || ''}</div>
            <div class="product-bottom">
              <div class="price">R$ ${Number(p.preco).toFixed(2).replace('.', ',')}</div>
              <button class="add-btn" onclick="window.addToCart('${p.id}')"><i class="fa-solid fa-plus"></i></button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Filtrar Categoria
    window.filterCategory = function(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    };

    // Modo Desenvolvedor
    window.promptDevMode = function() {
      if (isDevMode) {
        isDevMode = false;
        document.getElementById('dev-panel').style.display = 'none';
        alert("Modo Desenvolvedor desativado.");
      } else {
        const pin = prompt("Digite o PIN do Desenvolvedor:");
        if (pin === "1943") {
          isDevMode = true;
          document.getElementById('dev-panel').style.display = 'block';
          alert("Modo Desenvolvedor ativado!");
        } else if (pin !== null) {
          alert("PIN incorreto!");
        }
      }
      renderProducts();
    };

    // Modal de Produto
    window.openProductModal = function() {
      document.getElementById('prod-id').value = '';
      document.getElementById('prod-name').value = '';
      document.getElementById('prod-price').value = '';
      document.getElementById('prod-category').value = 'Paes';
      document.getElementById('prod-image').value = '';
      document.getElementById('prod-desc').value = '';
      document.getElementById('modal-title').in
