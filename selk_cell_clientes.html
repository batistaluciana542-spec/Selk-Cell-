<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selk Cell | Loja</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef6ff;color:#10243e}
.top{background:linear-gradient(135deg,#087cf5,#0046a8);color:white;padding:16px;display:flex;align-items:center;gap:14px}
.dots{font-size:28px;background:none;border:0;color:#fff;cursor:pointer}
.logo{font-size:25px;font-weight:800}
.hero{padding:34px 18px;text-align:center;background:#fff}
.hero h1{margin:0 0 8px;font-size:32px}
.hero p{margin:0;color:#55708f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:20px;max-width:1100px;margin:auto}
.card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 6px 22px #1232}
.pic{height:190px;border-radius:13px;background:#e8f2ff;display:flex;align-items:center;justify-content:center;font-size:70px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.price{font-size:22px;font-weight:800;color:#087cf5}
.buy,.save{width:100%;border:0;border-radius:12px;padding:12px;background:#087cf5;color:white;font-weight:700;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:18px}
.box{background:#fff;border-radius:18px;padding:22px;max-width:430px;width:100%;max-height:90vh;overflow:auto}
.box input,.box textarea,.box select{width:100%;padding:11px;margin:6px 0 10px;border:1px solid #ccd9e8;border-radius:9px}
.close{float:right;border:0;background:none;font-size:24px}
.menu{display:none;position:absolute;top:58px;left:10px;background:#fff;border-radius:12px;box-shadow:0 8px 25px #0003;padding:8px;z-index:5}
.menu button{border:0;background:white;padding:12px 18px;cursor:pointer}
.admin{display:none}
.notice{padding:12px 18px;background:#fff3cd;color:#765b00;display:none}
</style>
</head>

<body>

<header class="top">
<button class="dots" onclick="toggleMenu()">⋮</button>
<div class="logo">📱 Selk Cell</div>
</header>

<div id="menu" class="menu">
<button onclick="developerLogin()">⚙️ Desenvolvedor</button>
</div>

<section class="hero">
<h1>Celulares e acessórios do seu jeito.</h1>
<p>Escolha seu produto e faça seu pedido.</p>
</section>

<div id="notice" class="notice"></div>

<main id="client">
<div id="products" class="grid"></div>
</main>

<section id="admin" class="admin">
<div class="hero">
<h1>Editor da Selk Cell</h1>
<p>As alterações são enviadas para o banco online quando o Supabase estiver configurado.</p>
</div>
<div id="editor" class="grid"></div>
</section>

<div id="modal" class="modal">
<div class="box">
<button class="close" onclick="closeModal()">×</button>
<h2 id="modalTitle">Comprar</h2>
<div id="modalBody"></div>
</div>
</div>

<script>
const SUPABASE_URL='https://xylvkfcaxsexldyjfzmk.supabase.co';

/* COLE AQUI SUA CHAVE PUBLICA DO SUPABASE */
const SUPABASE_ANON_KEY='SUA_CHAVE_PUBLICA_AQUI';

const phone='5564996609321';

const defaults=[
['iPhone 15','3999.00','128 GB • Novo','📱'],
['Galaxy S24','3499.00','256 GB • 5G','📱'],
['Redmi Note 14','1599.00','256 GB • 8 GB RAM','📱'],
['Moto G55','1299.00','128 GB • 5G','📱'],
['AirPods','899.00','Áudio sem fio','🎧'],
['Smartwatch','349.00','Monitoramento e notificações','⌚'],
['Carregador Turbo','99.90','Carga rápida','🔌'],
['Capa Premium','59.90','Proteção e estilo','🛡️'],
['Película 3D','39.90','Proteção de tela','✨'],
['Power Bank','149.90','10.000 mAh','🔋']
];

let products=defaults.map((x,i)=>({
id:i+1,
name:x[0],
price:x[1],
description:x[2],
emoji:x[3],
image:''
}));

function configured(){
return SUPABASE_URL.startsWith('https://') &&
SUPABASE_ANON_KEY.startsWith('sb_publishable_');
}

async function load(){
if(configured()){
try{
let r=await fetch(
SUPABASE_URL+'/rest/v1/products?select=*&order=id',
{
headers:{
apikey:SUPABASE_ANON_KEY,
Authorization:'Bearer '+SUPABASE_ANON_KEY
}
}
);

if(r.ok){
let d=await r.json();
if(d.length)products=d;
}
}catch(e){}
}else{
let l=localStorage.getItem('selkProducts');
if(l)try{products=JSON.parse(l)}catch(e){}
}

render();
}

function render(){
products.sort((a,b)=>a.id-b.id);

let productsEl=document.getElementById('products');

productsEl.innerHTML=products.map(p=>`
<article class="card">
<div class="pic">
${p.image?`<img src="${esc(p.image)}">`:p.emoji||'📦'}
</div>
<h2>${esc(p.name)}</h2>
<p>${esc(p.description)}</p>
<div class="price">R$ ${esc(p.price)}</div>
<br>
<button class="buy" onclick="buy(${p.id})">Comprar agora</button>
</article>
`).join('');
}

function esc(s){
return String(s??'').replace(
/[&<>"']/g,
c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c])
);
}

function toggleMenu(){
let m=document.getElementById('menu');
m.style.display=m.style.display==='block'?'none':'block';
}

function developerLogin(){
toggleMenu();

let p=prompt('Senha do desenvolvedor:');

if(p==='1943'){
document.getElementById('client').style.display='none';
document.getElementById('admin').style.display='block';
renderEditor();
}else if(p!==null){
alert('Senha incorreta.');
}
}

function renderEditor(){
document.getElementById('editor').innerHTML=products.map(p=>`
<article class="card">
<label>Nome
<input id="n${p.id}" value="${esc(p.name)}">
</label>

<label>Preço
<input id="p${p.id}" value="${esc(p.price)}">
</label>

<label>Descrição
<textarea id="d${p.id}">${esc(p.description)}</textarea>
</label>

<label>URL da foto
<input id="i${p.id}" value="${esc(p.image||'')}" placeholder="https://...">
</label>

<label>Emoji
<input id="e${p.id}" value="${esc(p.emoji||'📦')}">
</label>

<button class="save" onclick="save(${p.id})">
Salvar produto
</button>
</article>
`).join('');
}

async function save(id){
let p=products.find(x=>x.id==id);

Object.assign(p,{
name:document.getElementById('n'+id).value,
price:document.getElementById('p'+id).value,
description:document.getElementById('d'+id).value,
image:document.getElementById('i'+id).value,
emoji:document.getElementById('e'+id).value
});

localStorage.setItem('selkProducts',JSON.stringify(products));

let ok=false;

if(configured()){
try{
let r=await fetch(
SUPABASE_URL+'/rest/v1/products?id=eq.'+id,
{
method:'PATCH',
headers:{
apikey:SUPABASE_ANON_KEY,
Authorization:'Bearer '+SUPABASE_ANON_KEY,
'Content-Type':'application/json',
'Prefer':'return=minimal'
},
body:JSON.stringify(p)
}
);

ok=r.ok;
}catch(e){}
}

render();
renderEditor();

alert(
ok
?'Produto salvo online!'
:'Produto salvo neste navegador. Configure o Supabase para sincronizar com todos os clientes.'
);
}

function buy(id){
let p=products.find(x=>x.id==id);

document.getElementById('modalTitle').textContent='Comprar: '+p.name;

document.getElementById('modalBody').innerHTML=`
<p><b>R$ ${esc(p.price)}</b></p>
<input id="cn" placeholder="Seu nome">
<input id="ct" placeholder="Telefone">
<input id="ca" placeholder="Endereço">

<select id="cp">
<option>Pix</option>
<option>Dinheiro</option>
<option>Cartão</option>
</select>

<button class="buy" onclick="send(${p.id})">
Enviar pedido pelo WhatsApp
</button>
`;

document.getElementById('modal').style.display='flex';
}

function send(id){
let p=products.find(x=>x.id==id);

let n=document.getElementById('cn').value;
let t=document.getElementById('ct').value;
let a=document.getElementById('ca').value;
let pay=document.getElementById('cp').value;

if(!n||!t||!a){
alert('Preencha seus dados.');
return;
}

let msg=`🛍️ NOVO PEDIDO - SELK CELL

Produto: ${p.name}
Valor: R$ ${p.price}

Cliente: ${n}
Telefone: ${t}
Endereço: ${a}
Pagamento: ${pay}`;

location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(msg);
}

function closeModal(){
document.getElementById('modal').style.display='none';
}

load();
</script>

</body>
</html>
