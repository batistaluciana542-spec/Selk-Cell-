<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selk Cell | Loja</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f8ff;color:#10213f}
header{background:linear-gradient(135deg,#006cff,#00a8ff);color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 4px 18px #006cff33}
.logo{font-size:27px;font-weight:800}.cart{border:0;background:white;color:#006cff;padding:11px 16px;border-radius:12px;font-weight:700;cursor:pointer}
.hero{padding:55px 5%;background:linear-gradient(135deg,#e8f3ff,#fff)}.hero h1{font-size:clamp(30px,6vw,52px);margin:0 0 12px}.hero p{font-size:18px;color:#50627d;margin:0}
main{padding:35px 5% 60px;max-width:1250px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:white;border-radius:18px;padding:16px;box-shadow:0 7px 25px #123c6812;border:1px solid #e5efff;display:flex;flex-direction:column}.photo{height:190px;border-radius:14px;background:#eef6ff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:15px}.photo img{width:100%;height:100%;object-fit:cover}.emoji{font-size:65px}.card h3{margin:4px 0 7px;font-size:19px}.desc{color:#687991;min-height:38px;font-size:14px}.price{font-size:22px;font-weight:800;color:#006cff;margin:10px 0}.buy{border:0;background:#006cff;color:white;border-radius:11px;padding:13px;font-weight:800;cursor:pointer;width:100%;font-size:15px}.buy:hover{background:#0057d6}
.modal{display:none;position:fixed;inset:0;background:#07182b99;align-items:center;justify-content:center;padding:18px;z-index:20}.box{background:white;border-radius:20px;width:min(520px,100%);padding:24px;max-height:90vh;overflow:auto}.close{float:right;border:0;background:#edf4ff;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}.summary{background:#f2f7ff;padding:14px;border-radius:13px;margin:18px 0}.field{margin:12px 0}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #cddcf0;border-radius:10px;font:inherit}.field textarea{min-height:75px;resize:vertical}.send{width:100%;border:0;background:#20a64a;color:white;padding:14px;border-radius:11px;font-size:16px;font-weight:800;cursor:pointer}.note{font-size:12px;color:#73839a;margin-top:12px;text-align:center}
.empty{text-align:center;padding:40px;color:#64748b}
</style>
</head>
<body>
<header><div class="logo">📱 Selk Cell</div><button class="cart" onclick="openCart()">🛒 Meu pedido (<span id="count">0</span>)</button></header>
<section class="hero"><h1>Celulares e acessórios do seu jeito.</h1><p>Escolha seu produto e envie o pedido diretamente para a Selk Cell pelo WhatsApp.</p></section>
<main><div class="grid" id="products"></div></main>

<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><h2>Finalizar pedido</h2><div class="summary" id="summary"></div>
<div class="field"><label>Seu nome</label><input id="name" placeholder="Digite seu nome"></div>
<div class="field"><label>Telefone</label><input id="phone" placeholder="(00) 00000-0000"></div>
<div class="field"><label>Endereço</label><textarea id="address" placeholder="Rua, número, bairro e cidade"></textarea></div>
<div class="field"><label>Forma de pagamento</label><select id="payment"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select></div>
<button class="send" onclick="sendOrder()">📲 Enviar pedido pelo WhatsApp</button><div class="note">O WhatsApp será aberto com os dados do pedido preenchidos.</div></div></div>

<script>
const defaults=[
{name:'iPhone 15',price:'R$ 3.999,00',desc:'128 GB • Novo',emoji:'📱'},
{name:'Galaxy S24',price:'R$ 3.499,00',desc:'256 GB • 5G',emoji:'📱'},
{name:'Redmi Note 14',price:'R$ 1.599,00',desc:'256 GB • 8 GB RAM',emoji:'📱'},
{name:'Moto G55',price:'R$ 1.299,00',desc:'128 GB • 5G',emoji:'📱'},
{name:'AirPods',price:'R$ 899,00',desc:'Áudio sem fio',emoji:'🎧'},
{name:'Smartwatch',price:'R$ 349,00',desc:'Monitoramento e notificações',emoji:'⌚'},
{name:'Carregador Turbo',price:'R$ 99,90',desc:'Carga rápida',emoji:'🔌'},
{name:'Capa Premium',price:'R$ 59,90',desc:'Proteção e estilo',emoji:'🛡️'},
{name:'Película 3D',price:'R$ 39,90',desc:'Proteção de tela',emoji:'✨'},
{name:'Power Bank',price:'R$ 149,90',desc:'10.000 mAh',emoji:'🔋'}];
let products=defaults;let selected=null;let cart=[];
try{const saved=JSON.parse(localStorage.getItem('selkProducts'));if(Array.isArray(saved)&&saved.length) products=saved}catch(e){}
function render(){const el=document.getElementById('products');el.innerHTML='';products.forEach((p,i)=>{const card=document.createElement('div');card.className='card';const image=p.image?`<img src="${p.image}" alt="${escapeHtml(p.name||'Produto')}">`:`<div class="emoji">${p.emoji||'📱'}</div>`;card.innerHTML=`<div class="photo">${image}</div><h3>${escapeHtml(p.name||'Produto')}</h3><div class="desc">${escapeHtml(p.desc||'')}</div><div class="price">${escapeHtml(p.price||'')}</div><button class="buy" onclick="buy(${i})">Comprar agora</button>`;el.appendChild(card)})}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function buy(i){selected=products[i];cart=[selected];updateCount();showModal()}
function openCart(){if(!cart.length){alert('Seu pedido ainda está vazio. Escolha um produto primeiro.');return}showModal()}
function showModal(){document.getElementById('summary').innerHTML=`<strong>${escapeHtml(selected.name)}</strong><br>${escapeHtml(selected.price)}<br><small>${escapeHtml(selected.desc||'')}</small>`;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function updateCount(){document.getElementById('count').textContent=cart.length}
function sendOrder(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim(),payment=document.getElementById('payment').value;if(!name||!phone||!address){alert('Preencha nome, telefone e endereço para enviar o pedido.');return}const msg=`🛍️ NOVO PEDIDO - SELK CELL\n\nProduto: ${selected.name}\nValor: ${selected.price}\nDescrição: ${selected.desc||''}\n\nCliente: ${name}\nTelefone: ${phone}\nEndereço: ${address}\nPagamento: ${payment}`;window.open('https://wa.me/5564996609321?text='+encodeURIComponent(msg),'_blank')}
render();updateCount();
</script>
</body></html>
